name: Step Types

on:
  workflow_dispatch:

jobs:
  Say-Hello-Inline-Bash:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello, World"

  Say-Hello-Inline-Python:
    runs-on: ubuntu-latest
    steps:
      - run: print("Hello, World")
        shell: python

  Say-Hello-Action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1d96c772d19495a3b5c517cd2bc0cb401ea0529f # v4.1.3
        with:
          who-to-greet: "World"
