name: Environment Variables 

on:  
  workflow_dispatch:

env:
  WORKFLOW_VAR: "workflow_Scope"

jobs:
  job-1: 
    runs-on: ubuntu-latest
    env:
      JOB_VAR: "job-1_Scope"
    steps:
      - name: Inspect Scope job-1 step-1 
        env:
          STEP_VAR: "step-1_Scope" 
        run: |
          echo "WOKFLOW_VAR: $WORKFLOW_VAR" # visible 
          echo "JOB_VAR: $JOB_VAR"          # visible 
          echo "STEP_VAR: $STEP_VAR"        # visible only here
        
      - name: Inspect Scope job-1 step-2 
        run: |
          echo "WOKFLOW_VAR: $WORKFLOW_VAR" # visible 
          echo "JOB_VAR: $JOB_VAR"          # visible 
          echo "STEP_VAR: $STEP_VAR"        # not visible 
          
  job-2: 
    runs-on: ubuntu-latest     
    steps:
      - name: Inspect Scope job-2 step-1 
        run: |
          echo "WOKFLOW_VAR: $WORKFLOW_VAR" # visible 
          echo "JOB_VAR: $JOB_VAR"          # not visible 
          echo "STEP_VAR: $STEP_VAR"        # not visible 
